<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OniRender</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app">
    <header class="hero">
      <h1>OniRender v0.1</h1>
      <p>PNG sequence folder to MP4</p>
    </header>

    <section class="card">
      <div class="row">
        <button id="btnPickFolder">1. Select PNG Folder</button>
        <span id="folderPath" class="muted">No folder selected</span>
      </div>

      <div id="groupsWrap" class="hidden">
        <label for="groupSelect">Detected Sequences</label>
        <select id="groupSelect"></select>
        <div id="groupMeta" class="meta"></div>
      </div>
    </section>

    <section class="card">
      <div class="row">
        <label for="fpsInput">FPS</label>
        <input id="fpsInput" type="number" min="1" max="240" step="1" value="30" />
      </div>
      <div class="row">
        <label class="check"><input id="stopOnMissing" type="checkbox" checked /> Stop on missing frames</label>
      </div>
      <div class="row">
        <button id="btnPickOutput">2. Choose Output MP4</button>
        <span id="outputPath" class="muted">No output selected</span>
      </div>
    </section>

    <section class="card">
      <div class="row">
        <button id="btnRender" class="primary" disabled>Render MP4</button>
        <button id="btnCancel" class="danger" disabled>Cancel</button>
      </div>
      <div class="progressTrack">
        <div id="progressFill" class="progressFill" style="width:0%"></div>
      </div>
      <div id="progressText" class="meta">Idle</div>
      <pre id="log" class="log"></pre>
    </section>
  </main>

  <script src="./renderer.js"></script>
</body>
</html>
